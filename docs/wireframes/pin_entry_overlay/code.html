<section>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="drag_handle">drag_handle</span>
</div>
</div>

<div class="pin-dot filled"></div>

</button>
<button class="aspect-square flex items-center justify-center rounded-full bg-surface-container-highest text-on-surface font-headline text-2xl hover:bg-primary hover:text-surface transition-colors duration-200 active:scale-90">0</button>
<button class="aspect-square flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface transition-colors duration-200">

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-[#0e0e0e] rounded-t-[0.75rem] z-50 shadow-[0px_-12px_24px_rgba(0,0,0,0.5)]">
