<!doctype html>

<html class="dark" lang="en">

    <style>

        box-shadow: 0 0 15px -3px rgba(202, 253, 0, 0.3);
      }
      .neon-glow-secondary {
        box-shadow: 0 0 15px -3px rgba(255, 107, 155, 0.3);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;

        -ms-overflow-style: none;

    <!-- TopAppBar -->

        >
        <h1
          class="font-['Space_Grotesk'] font-bold tracking-tighter text-2xl text-[#f3ffca]"
        >
          Cue The Music
        </h1>
      </div>
      <button

      >
        <span class="material-symbols-outlined" data-icon="lock_open"

          <input

            placeholder="Search the collection..."
            type="text"
          />
        </div>
        <!-- Filter Chips - Horizontal Scroll -->
        <div class="flex flex-col gap-4 overflow-hidden">
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <span

            <button
              class="whitespace-nowrap px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-bold active:scale-95 transition-all"
            >
              Jazz
            </button>
            <button
              class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-variant text-on-surface text-sm font-medium hover:bg-surface-container-highest active:scale-95 transition-all"
            >
              Soul
            </button>
            <button
              class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-variant text-on-surface text-sm font-medium hover:bg-surface-container-highest active:scale-95 transition-all"

              Electronic

          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <span
              class="text-xs font-bold text-on-surface-variant uppercase tracking-widest self-center mr-2 font-label"
              >Decade</span
            >
            <button
              class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-variant text-on-surface text-sm font-medium hover:bg-surface-container-highest active:scale-95 transition-all"
            >
              70s
            </button>
            <button
              class="whitespace-nowrap px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-bold active:scale-95 transition-all"
            >
              80s

            >
              90s
            </button>

        </div>

              </div>
            </div>
            <div class="px-1">
              <h3

                Static Waves

              <p class="text-on-surface-variant text-sm font-medium">

    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-[#0e0e0e] rounded-t-[0.75rem] z-50 shadow-[0px_-12px_24px_rgba(0,0,0,0.5)]"
    >
      <a
